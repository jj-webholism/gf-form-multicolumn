name: Code Quality & Static Analysis

on:
  push:
    branches: [ main, develop, master, 'v*' ]
  pull_request:
    branches: [ main, develop, master, 'v*' ]

jobs:
  static-analysis:
    name: PHPCS & PHPStan (PHP ${{ matrix.php-version }} | GF Stub ${{ matrix.gf-stub-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.1', '8.2', '8.3', '8.4' ]
        gf-stub-version: [ '2.8.*', '2.9.*', 'dev-master' ]
        include:
          - php-version: '8.5'
            gf-stub-version: 'dev-master'
            experimental: true

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CodeSniffer
        run: composer check-cs

      # Swaps out stubs using -W (--with-all-dependencies) and targeting existing tags
      - name: Require specific GF Stub version
        if: matrix.gf-stub-version != 'dev-master'
        run: composer require --dev "php-stubs/gravity-forms-stubs:${{ matrix.gf-stub-version }}" -W

      - name: Run PHPStan Analysis
        run: composer stan